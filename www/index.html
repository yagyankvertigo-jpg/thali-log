<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thali Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#18212B; --ink2:#5A6677; --line:#DDE3EB; --track:#E3E8EF;
  --cal:#F0A202; --pro:#2C9A63; --carb:#5468E0; --fat:#D6457A; --burn:#0C8E9C; --over:#D8504A;
  --user-bg:#18212B; --user-ink:#FFFFFF; --good:#DDF1E4; --warn:#FBE7C8; --low:#E2E8F7; --shadow:rgba(20,30,50,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --surface:#181E27; --surface2:#202733; --ink:#E9EDF3; --ink2:#9AA6B7; --line:#2B3441; --track:#2A3340;
    --cal:#F5B52E; --pro:#4CC386; --carb:#8798FF; --fat:#F0709F; --burn:#3CC3D1; --over:#F2706A;
    --user-bg:#F5B52E; --user-ink:#1B1400; --good:#173325; --warn:#3A2C14; --low:#1E2641; --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --surface:#181E27; --surface2:#202733; --ink:#E9EDF3; --ink2:#9AA6B7; --line:#2B3441; --track:#2A3340;
  --cal:#F5B52E; --pro:#4CC386; --carb:#8798FF; --fat:#F0709F; --burn:#3CC3D1; --over:#F2706A;
  --user-bg:#F5B52E; --user-ink:#1B1400; --good:#173325; --warn:#3A2C14; --low:#1E2641; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
:focus-visible{outline:2px solid var(--carb);outline-offset:2px}

.top{display:flex;align-items:center;gap:4px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.title{font:700 17px "Bricolage Grotesque","Figtree",system-ui,sans-serif;background:none;border:0;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.ib{width:36px;height:36px;flex:none;border-radius:10px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.ib.on{background:var(--cal);color:#1B1400}
.ib:disabled{opacity:.3;cursor:default}
.ib.sm{width:30px;height:30px;border-radius:8px}
.ib.sm .ic{width:16px;height:16px}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}

.stats{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px 12px 80px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.hero{display:flex;align-items:center;gap:18px;padding:2px 4px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:700 30px/1 "Bricolage Grotesque","Figtree",sans-serif;font-variant-numeric:tabular-nums}
.ring span{font-size:11.5px;color:var(--ink2);margin-top:3px}
.kv{flex:1;display:grid;gap:7px;min-width:0}
.kv div{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv .l{color:var(--ink2)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.kv .burn b{color:var(--burn)}
.kv .over b{color:var(--over)}
.mrow{display:grid;grid-template-columns:58px 1fr 92px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.mrow .v{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;text-align:right}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.bar.sm{height:4px;margin-top:5px}
.micro{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.micro div{font-size:11.5px;color:var(--ink2)}
.micro b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

.grp h3{font:600 12.5px "Figtree",sans-serif;color:var(--ink2);display:flex;justify-content:space-between;padding:8px 2px 5px;border-bottom:1px solid var(--line)}
.ent{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.ent .n{font-weight:500}
.ent small{display:block;color:var(--ink2);font-size:12px}
.ent .k{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ent .k.neg{color:var(--burn)}
.mac{display:flex;gap:10px;font-size:11.5px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.mac span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:4px}
.empty{color:var(--ink2);font-size:14px;padding:18px 6px;text-align:center}

.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 9px}
.sum b{display:block;font:700 18px "Bricolage Grotesque","Figtree",sans-serif;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--ink2);text-align:center;padding:2px 0}
.cell{aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px 4px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.cell .dn{font-size:11px;color:var(--ink2);font-weight:600;line-height:1}
.cell .kc{font:700 12px "Bricolage Grotesque","Figtree",sans-serif;font-variant-numeric:tabular-nums;line-height:1}
.cell .pp{font-size:9.5px;color:var(--ink2);line-height:1;margin-bottom:2px}
.cell.ok{background:var(--good)}
.cell.over{background:var(--warn)}
.cell.low{background:var(--low)}
.cell.today{outline:2px solid var(--ink);outline-offset:-2px}
.cell.blank{visibility:hidden}
.cell.none .kc{color:var(--ink2);font-weight:500}
.pbar{height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pro)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.chart{width:100%;height:auto;display:block}
.ch-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.ch-h span{font-weight:400;color:var(--ink2);font-size:12px}

.chat{flex:0 0 46%;min-height:240px;max-height:64%;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px var(--shadow)}
.chat.hide{display:none}
.chead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 0 14px;font:700 14px "Bricolage Grotesque","Figtree",sans-serif;color:var(--ink2)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;padding:8px 11px;border-radius:14px;font-size:14px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--user-bg);color:var(--user-ink);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:5px}
.m .row:first-child{margin-top:0}
.m .row small{display:block;color:var(--ink2);font-size:12px}
.m .num{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .num.neg{color:var(--burn)}
.m .tot{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.m .warn{margin-top:6px;font-size:13px;color:var(--ink2)}
.m code{font:500 12.5px "Figtree",sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.cand{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;margin-top:6px;cursor:pointer}
.cand b{font-weight:500;font-size:13.5px}
.cand small{display:block;color:var(--ink2);font-size:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;font:500 12.5px "Figtree",sans-serif;cursor:pointer;white-space:nowrap}
.inp{display:flex;gap:8px;padding:6px 10px 10px}
.inp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:11px 12px;font:400 16px "Figtree",sans-serif}
.send{width:46px;border:0;border-radius:12px;background:var(--cal);color:#1B1400;display:grid;place-items:center;cursor:pointer}
.fab{position:absolute;right:14px;bottom:14px;display:none;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--cal);color:#1B1400;padding:12px 18px 12px 14px;font:600 14px "Figtree",sans-serif;cursor:pointer;box-shadow:0 6px 18px var(--shadow)}
.app.nochat .fab{display:flex}

.ov{position:absolute;inset:0;background:rgba(10,15,25,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{max-height:92%;overflow-y:auto;background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px;display:grid;gap:12px}
.sheet h2{font:700 18px "Bricolage Grotesque","Figtree",sans-serif;display:flex;justify-content:space-between;align-items:center}
.fld{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:14px}
.fld small{display:block;color:var(--ink2);font-size:12px}
.fld input{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:9px 10px;font:400 16px "Figtree",sans-serif;width:100%}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:500}
.btn.danger{color:var(--over)}
.note{font-size:12px;color:var(--ink2)}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .35s ease} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="nav">
      <button class="ib" data-act="prev" aria-label="Previous" data-ic="left"></button>
      <button class="title" id="title" data-act="today" title="Jump to today"></button>
      <button class="ib" id="nextB" data-act="next" aria-label="Next" data-ic="right"></button>
    </div>
    <button class="ib" id="vDay" data-act="vday" aria-label="Daily view" title="Daily view" data-ic="list"></button>
    <button class="ib" id="vMonth" data-act="vmonth" aria-label="Monthly view" title="Monthly view" data-ic="cal"></button>
    <span class="sep"></span>
    <button class="ib" id="tChat" data-act="tchat" aria-label="Show or hide chat" title="Show or hide chat" data-ic="chat"></button>
    <button class="ib" data-act="settings" aria-label="Goals and settings" title="Goals and settings" data-ic="sliders"></button>
  </header>

  <main class="stats" id="stats"></main>

  <section class="chat" id="chat" aria-label="Log chat">
    <div class="chead"><span>Log</span><button class="ib sm" data-act="tchat" aria-label="Hide chat" data-ic="down"></button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="inp">
      <input id="inp" type="text" autocomplete="off" enterkeyhint="send" placeholder="What did you eat or do?" aria-label="Log entry">
      <button class="send" data-act="send" aria-label="Send" data-ic="send"></button>
    </div>
  </section>

  <button class="fab" data-act="tchat" aria-label="Open chat to log an entry"><span data-ic="chat"></span>Log entry</button>

  <div class="ov" id="ov" data-act="closeov">
    <div class="sheet" role="dialog" aria-label="Goals and settings">
      <h2>Goals and settings <button class="ib sm" data-act="closeov" aria-label="Close" data-ic="x"></button></h2>
      <label class="fld"><span>Body weight<small>Used to estimate calories burned</small></span><input id="sWeight" type="number" inputmode="decimal" min="20" max="250"></label>
      <label class="fld"><span>Daily calorie goal<small>kcal, after subtracting workouts</small></span><input id="sKcal" type="number" inputmode="numeric" min="800" max="6000"></label>
      <label class="fld"><span>Daily protein goal<small>grams</small></span><input id="sPro" type="number" inputmode="numeric" min="10" max="400"></label>
      <p class="note">Carb and fat targets are set from your calorie goal (50% and 28%). Fibre, iron, calcium and vitamin C use typical adult daily references. Values are estimates, not medical advice.</p>
      <label class="fld"><span>USDA API key<small>Optional. Free at fdc.nal.usda.gov, gives more online lookups</small></span><input id="sKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="fld"><span>Anthropic API key<small>Optional. Lets lookup search the whole web for any dish. Billed by Anthropic per lookup. Stays on this phone.</small></span><input id="sAI" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="fld"><span id="savedN">Saved foods: 0<small>Values found online, kept for next time</small></span><button class="btn" id="forgetB" data-act="forget">Forget</button></div>
      <button class="btn danger" id="clearB" data-act="clear">Clear all data</button>
    </div>
  </div>
</div>

<script src="foods-data.js"></script>
<script>
(function(){
"use strict";
const KEY="thali-log-v1";
const S={settings:{weight:70,kcal:2000,protein:90,usdaKey:"",aiKey:""},days:{},chat:[],custom:[],aliases:[]};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const o=JSON.parse(raw);
    if(o&&typeof o==="object"){
      Object.assign(S.settings,o.settings||{});
      S.days=(o.days&&typeof o.days==="object")?o.days:{};
      S.chat=Array.isArray(o.chat)?o.chat:[];
      S.custom=Array.isArray(o.custom)?o.custom:[];
      S.aliases=Array.isArray(o.aliases)?o.aliases:[];
    }}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

//<<PARSER
const f1=n=>String(Math.round(n*10)/10);
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,half:0.5,quarter:0.25,dedh:1.5,dhai:2.5,ek:1};
const NUMRE=new RegExp("\\b("+Object.keys(NUMW).join("|")+")\\b","g");
function norm(x){
  let s=String(x).toLowerCase();
  s=s.replace(/(\d)\s*½/g,"$1.5").replace(/(\d)\s*¼/g,"$1.25").replace(/(\d)\s*¾/g,"$1.75").replace(/½/g,"0.5").replace(/¼/g,"0.25").replace(/¾/g,"0.75");
  s=s.replace(/half an? hour|half hour|aadha ghanta/g,"30 min").replace(/\ban hour\b/g,"1 hour");
  s=s.replace(/(\d+)\s+(\d+)\/(\d+)/g,(m,a,b,c)=>String(Number(a)+Number(b)/Number(c)));
  s=s.replace(/(\d+)\/(\d+)/g,(m,a,b)=>String(Number(a)/Number(b)));
  s=s.replace(NUMRE,m=>" "+NUMW[m]+" ");
  s=s.replace(/(\d+)\s*sets?\s*(?:of)?\s*(\d+)/g,"$1x$2").replace(/(\d+)\s*x\s*(\d+)/g,"$1x$2");
  s=s.replace(/(\d+(?:\.\d+)?)\s*x\s+(?=[a-z])/g,"$1 ").replace(/\bx\s*(\d+)\b/g," $1 ");
  s=s.replace(/[-_\/]/g," ").replace(/[^\p{L}\p{M}\p{N}. ]/gu," ").replace(/\.(?!\d)/g," ").replace(/\s+/g," ").trim();
  return s;
}
function sing(w){
  if(w.length>3&&w.endsWith("oes"))return w.slice(0,-2);
  if(w.length>3&&w.endsWith("ies"))return w.slice(0,-3)+"y";
  if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss")&&!w.endsWith("us"))return w.slice(0,-1);
  return w;
}
const STOP=new Set(["of","with","a","an","the","some","my","home","made","homemade","cooked","fresh","little","just","also","then","approx","about","around","roughly","medium","regular","small","mini","large","big","extra"]);
function toks(s){return s.split(" ").filter(w=>w&&!STOP.has(w)).map(sing);}
function lev1(a,b){
  if(a===b)return true;
  let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  if(a.length===b.length)return a.slice(i+1)===b.slice(i+1);
  if(a.length>b.length)return a.slice(i+1)===b.slice(i);
  return b.slice(i+1)===a.slice(i);
}
function tokEq(a,b,exact){
  if(a===b)return true;
  if(exact)return false;
  return a.length>=5&&b.length>=5&&Math.abs(a.length-b.length)<=1&&lev1(a,b);
}
function findIn(list,it,exact){
  let best=null,bs=0;
  for(const item of list){
    for(const a of item.at){
      const n=a.length;
      if(!n||n>it.length)continue;
      for(let s=0;s<=it.length-n;s++){
        let ok=true,fz=false;
        for(let j=0;j<n;j++){if(!tokEq(it[s+j],a[j],exact)){ok=false;break;}if(it[s+j]!==a[j])fz=true;}
        if(ok){const sc=n*1000+(item.pri||0)*100+Math.min(a.join("").length,99)-(fz?30:0);if(sc>bs){bs=sc;best={item,start:s,n,fz};}}
      }
    }
  }
  return best;
}

/* Foods per 100 g (cooked/ready-to-eat unless noted):
   name, aliases, kcal, protein, carbs, fat, fibre, iron mg, calcium mg, vit C mg, default grams per unit, flags
   flags: c = countable piece, k = katori-based, l = liquid, cuN = grams per cup, tsN = grams per teaspoon */
const RAW=[
["Roti / chapati","roti|chapati|chapatti|chapathi|phulka|fulka|rotli|tawa roti",300,9.5,55,4,3.9,3,25,0,40,"c"],
["Paratha (plain)","paratha|parantha|plain paratha|ghee paratha",326,7.5,48,12,3.5,2.5,30,0,80,"c"],
["Aloo paratha","aloo paratha|aloo parantha|stuffed paratha|gobi paratha|paneer paratha",270,6,38,11,3,1.8,30,3,100,"c"],
["Puri","puri|poori",350,7.5,45,16,3,2.5,25,0,25,"c"],
["Naan","naan|garlic naan|butter naan|kulcha|tandoori roti",290,9,50,5.5,2,2,60,0,90,"c"],
["Bhatura","bhatura|bhature",340,8,48,13,2.5,2,30,0,90,"c"],
["Thepla","thepla|methi thepla",290,9,42,10,5,3,60,3,40,"c"],
["Bread slice (white)","bread|white bread|bread slice|toast|sandwich bread",265,9,49,3.2,2.7,3.6,150,0,30,"c"],
["Brown bread","brown bread|whole wheat bread|multigrain bread",250,10,44,3.5,5,2.5,100,0,30,"c"],
["Pav (bun)","pav|ladi pav|bun",290,8,52,5,2.5,2.5,60,0,40,"c"],
["Idli","idli|idly",135,4,28,0.5,1,0.7,15,0,40,"c"],
["Dosa (plain)","dosa|plain dosa|dosai|sada dosa",170,4,29,4,1.2,1,20,0,80,"c"],
["Masala dosa","masala dosa|mysore dosa",180,4,28,5.5,2,1.2,25,5,150,"c"],
["Uttapam","uttapam|uttappam|oothappam",150,4.5,24,4,1.5,1.2,40,3,100,"c"],
["Medu vada","vada|medu vada|wada|vadai",290,9,28,15,3,2,40,0,50,"c"],

   ("pizza, 450 kcal, protein 15 g") or separate foods ("2 roti, 1 katori dal"). */
function groupInput(body){
  const groups=[];
  body.split(/\n|;/).map(x=>x.trim()).filter(Boolean).forEach(chunk=>{
    const segs=chunk.split(",").map(x=>x.trim()).filter(Boolean);
    let last=null;
    segs.forEach(sg=>{
      const sp=parseSpec(sg);
      const hasN=Object.keys(sp.v).length>0,hasName=sp.name.length>0;
      if(hasN&&!hasName){
        if(last){last.t+=", "+sg;last.n=true;}
        else{last={t:sg,name:false,n:true};groups.push(last);}
      }else if(!hasN&&hasName&&last&&last.n&&!last.name){
        last.t+=", "+sg;last.name=true;
      }else{
        last={t:sg,name:hasName,n:hasN};groups.push(last);
      }
    });
  });
  return groups.map(g=>g.t);
}
/* Closest matches for a food name that has no direct match. Spelling-tolerant (karela/karele, katahal/kathal, sabzi/sabji). */
const GENW=new Set(["sabzi","sabji","subzi","curry","masala","fry","ki","ka","ke","with","and","the","dry","gravy","tadka","stuffed","fried","roast"]);
function phon(w){return w.replace(/ph/g,"f").replace(/z/g,"j").replace(/w/g,"v").replace(/h/g,"").replace(/(.)\1+/g,"$1");}
function lev(a,b){
  const m=a.length,n=b.length;let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
function tsim(a,b){
  const pa=phon(a),pb=phon(b);
  if(pa===pb)return 1;
  const mn=Math.min(pa.length,pb.length),L=Math.max(pa.length,pb.length);
  if(mn<3||pa[0]!==pb[0])return 0;
  const r=1-lev(pa,pb)/L;
  if(L>=4&&r>=0.7)return r;
  if(mn>=4&&(pa.startsWith(pb)||pb.startsWith(pa)))return 0.75;
  return 0;
}
function suggest(name,limit){
  const q=toks(norm(name));
  if(!q.length)return [];
  const best=new Map();
  for(const f of allFoods()){
    let top=0;
    for(const a of f.at){
      if(!a.length)continue;
      let wq=0,sqq=0,content=false;
      q.forEach(t=>{const w=GENW.has(t)?0.35:1;let m=0;a.forEach(u=>{const s=tsim(t,u);if(s>m)m=s;});wq+=w;sqq+=w*m;if(m>=0.75&&w===1)content=true;});
      if(!content)continue;
      let wa=0,sa=0;
      a.forEach(u=>{const w=GENW.has(u)?0.35:1;let m=0;q.forEach(t=>{const s=tsim(t,u);if(s>m)m=s;});wa+=w;sa+=w*m;});
      const sc=0.6*sqq/wq+0.4*sa/wa;
      if(sc>top)top=sc;
    }
    if(top>=0.45){
      const cur=best.get(f.n);
      if(!cur||top>cur.score||(top===cur.score&&(f.pri||0)>(cur.f.pri||0)))best.set(f.n,{f,score:top});
    }
  }
  return Array.from(best.values()).sort((x,y)=>y.score-x.score||(y.f.pri||0)-(x.f.pri||0)).slice(0,limit||4);
}

function ringSVG(net,goal){

/* online lookup: USDA FoodData Central (generic foods) and Open Food Facts (packaged foods), values per 100 g */
let pending=null,sq=null;const partialMap={},specMap={},sugMap={};let lastSpec=null;
async function fetchJSON(url,opts,ms){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||9000);
  try{
    const r=await fetch(url,Object.assign({signal:ctl.signal},opts||{}));
    if(!r.ok)throw new Error("HTTP "+r.status);

  }finally{clearTimeout(t);}
}
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
const firstNum=(...a)=>{for(const x of a){if(x!=null&&isFinite(x))return Number(x);}return null;};
/* Indian ingredient names to English, so USDA can find them */
const EN={suran:"yam",jimikand:"yam",arbi:"taro",arvi:"taro",lauki:"bottle gourd",doodhi:"bottle gourd",ghiya:"bottle gourd",tinda:"round gourd",karela:"bitter melon",bhindi:"okra",baingan:"eggplant",brinjal:"eggplant",gobi:"cauliflower",phool:"cauliflower",patta:"cabbage",matar:"peas",palak:"spinach",methi:"fenugreek leaves",sarson:"mustard greens",kaddu:"pumpkin",tori:"ridge gourd",turai:"ridge gourd",parwal:"pointed gourd",kundru:"ivy gourd",shalgam:"turnip",mooli:"radish",gajar:"carrot",chukandar:"beetroot",shimla:"bell pepper",mirch:"pepper",sem:"broad beans",lobia:"cowpeas",moong:"mung beans",urad:"black gram",chana:"chickpeas",masoor:"lentils",toor:"pigeon peas",arhar:"pigeon peas",rajma:"kidney beans",bajra:"pearl millet",jowar:"sorghum",ragi:"finger millet",besan:"chickpea flour",sooji:"semolina",rava:"semolina",atta:"whole wheat flour",maida:"refined wheat flour",sabudana:"tapioca pearls",nariyal:"coconut",kela:"banana",aloo:"potato",pyaz:"onion",tamatar:"tomato",lehsun:"garlic",adrak:"ginger",dhania:"coriander leaves",pudina:"mint",makhana:"lotus seeds",singhara:"water chestnut",kathal:"jackfruit",mushroom:"mushrooms",soya:"soybeans"};
const DISHW=new Set(["sabzi","sabji","subzi","curry","masala","fry","bhaji","bhujia","tadka","gravy","dry","wali","ki","ka","ke","bhurta","bharta"]);
function queryVariants(name){
  const w=norm(name).split(" ").filter(Boolean);
  const tr=w.map(x=>EN[x]||x);
  const out=[{q:w.join(" "),tag:""}];
  const te=transFor(name);
  if(te&&norm(te)!==out[0].q)out.push({q:norm(te),tag:""});
  const t=tr.join(" ");
  if(t!==out[0].q)out.push({q:t,tag:""});
  const core=tr.filter(x=>!DISHW.has(x));
  const c=core.join(" ");
  if(c&&!out.some(o=>o.q===c))out.push({q:c,tag:" (ingredient only, raw)"});
  return out.slice(0,3);
}
async function searchUSDA(q){
  const key=(S.settings.usdaKey||"").trim()||"DEMO_KEY";
  const j=await fetchJSON("https://api.nal.usda.gov/fdc/v1/foods/search?api_key="+encodeURIComponent(key)+"&pageSize=8&dataType=Foundation,SR%20Legacy&query="+encodeURIComponent(q));
  const out=[];
  (j.foods||[]).forEach(f=>{
    const m={};
    (f.foodNutrients||[]).forEach(n=>{m[n.nutrientId]=n.value;if(n.nutrientNumber)m["n"+n.nutrientNumber]=n.value;});
    const kcal=firstNum(m[1008],m.n208,m[2047],m[2048]);
    if(kcal==null)return;
    out.push({label:f.description,src:"USDA",serving:null,v:[kcal,m[1003]||0,m[1005]||0,m[1004]||0,m[1079]||0,m[1089]||0,m[1087]||0,m[1162]||0]});
  });
  return out;
}
/* AI lookup: Claude with web search, needs the person's own Anthropic API key */
async function searchAI(name){
  const key=(S.settings.aiKey||"").trim();
  if(!key)return [];
  const prompt="You are a nutrition database for Indian home cooking. Find reliable nutrition values per 100 g (cooked, ready to eat) for: \""+name+"\""+(transFor(name)?" (English: "+transFor(name)+")":"")+". Use web search if useful (IFCT, NIN, USDA or reputable nutrition sites). If it is a prepared dish, assume a typical home-style recipe with the usual oil and spices. Reply with ONLY a JSON object, no markdown and no extra text, in exactly this shape: {\"name\":\"short display name\",\"per100g\":{\"kcal\":0,\"protein_g\":0,\"carbs_g\":0,\"fat_g\":0,\"fiber_g\":0,\"iron_mg\":0,\"calcium_mg\":0,\"vitamin_c_mg\":0},\"typical_serving_g\":0,\"serving_desc\":\"e.g. 1 katori\",\"note\":\"one short sentence on what this is and how reliable the numbers are\"}";
  let lastErr=null;
  for(const model of ["claude-sonnet-5-5","claude-sonnet-4-6"]){
    try{
      const j=await fetchJSON("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model,max_tokens:1500,tools:[{type:"web_search_20250305",name:"web_search",max_uses:3}],messages:[{role:"user",content:prompt}]})},45000);
      const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
      const i=text.indexOf("{"),k=text.lastIndexOf("}");
      if(i<0||k<=i)throw new Error("No data in reply");
      const o=JSON.parse(text.slice(i,k+1));
      const n=o.per100g||{};
      const v=[num(n.kcal),num(n.protein_g)||0,num(n.carbs_g)||0,num(n.fat_g)||0,num(n.fiber_g)||0,num(n.iron_mg)||0,num(n.calcium_mg)||0,num(n.vitamin_c_mg)||0];
      if(v[0]==null)throw new Error("No calories in reply");
      let note=String(o.note||"");
      const calc=4*v[1]+4*v[2]+9*v[3];
      if(v[0]>0&&Math.abs(calc-v[0])/v[0]>0.35)note+=" Check: protein, carbs and fat don’t add up to the calories.";
      return [{label:"AI estimate: "+String(o.name||name),src:"Claude with web search",serving:num(o.typical_serving_g),servingDesc:String(o.serving_desc||""),note:note.trim(),v}];
    }catch(e){
      lastErr=e;
      if(/HTTP (401|403|429|529)/.test(String(e.message)))throw e;
    }
  }
  throw lastErr||new Error("AI lookup failed");
}
async function searchOFF(q){
  const j=await fetchJSON("https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=10&fields=product_name,brands,nutriments,serving_quantity,countries_tags&search_terms="+encodeURIComponent(q));
  const out=[];
  (j.products||[]).forEach(p=>{
    const n=p.nutriments||{},kcal=num(n["energy-kcal_100g"]);
    if(kcal==null||!p.product_name)return;
    out.push({label:p.product_name+(p.brands?" ("+String(p.brands).split(",")[0]+")":""),src:"Open Food Facts",serving:num(p.serving_quantity),india:(p.countries_tags||[]).indexOf("en:india")>=0,
      v:[kcal,num(n.proteins_100g)||0,num(n.carbohydrates_100g)||0,num(n.fat_100g)||0,num(n.fiber_100g)||0,(num(n.iron_100g)||0)*1000,(num(n.calcium_100g)||0)*1000,(num(n["vitamin-c_100g"])||0)*1000]});
  });
  out.sort((a,b)=>(b.india?1:0)-(a.india?1:0));
  return out;
}
async function nextLookup(){
  if(!pending||!pending.queue.length){const cb=pending&&pending.after;pending=null;if(cb)cb();return;}
  const it=pending.queue.shift();
  pending.cur=it;pending.cands=[];
  const hasAI=!!(S.settings.aiKey||"").trim();
  pushMsg("a","Looking up <b>"+esc(it.name)+"</b> online"+(hasAI?" and searching the web":"")+"…");
  const vars=queryVariants(it.name);
  const jobs=[searchAI(it.name)].concat(vars.map(v=>searchUSDA(v.q)),[searchOFF(it.name)]);
  let r=[];
  try{r=await Promise.allSettled(jobs);}catch(e){r=[];}
  if(!pending)return;
  const ai=r[0]&&r[0].status==="fulfilled"?r[0].value:[];
  let aiErr="";
  if(hasAI&&r[0]&&r[0].status==="rejected"){
    const m=String(r[0].reason&&r[0].reason.message||"");
    aiErr=/HTTP 401|HTTP 403/.test(m)?"Your Anthropic API key was rejected.":/HTTP 429/.test(m)?"The AI service is busy or over its limit.":"AI lookup didn’t work this time.";
  }
  const usda=[],seen={};
  vars.forEach((v,i)=>{
    const x=r[1+i];
    if(x&&x.status==="fulfilled")x.value.slice(0,3).forEach(c=>{if(!seen[c.label]){seen[c.label]=1;c.label+=v.tag;usda.push(c);}});
  });
  const offR=r[1+vars.length];
  const off=offR&&offR.status==="fulfilled"?offR.value:[];
  const failed=r.length===0||r.every(x=>x.status==="rejected");
  const res=ai.concat(usda.slice(0,3),off.slice(0,2)).filter(c=>c.v[0]>=0&&c.v[0]<=950).slice(0,6);
  if(!res.length){
    pushMsg("a",(failed?"I couldn’t reach the food databases. Check your internet and try <code>lookup "+esc(it.name)+"</code> again. ":"Nothing found online for <b>"+esc(it.name)+"</b>. ")+(aiErr?esc(aiErr)+" ":"")+(hasAI?"":"Adding an Anthropic API key in settings lets me search the whole web. ")+manualHint(it.name));
    nextLookup();return;
  }
  pending.cands=res;
  let h="Which one is closest to <b>"+esc(it.name)+"</b>? Values are per 100 g, and I’ll save your pick for next time.";
  res.forEach((c,i)=>{h+='<button class="cand" data-act="pick" data-i="'+i+'"><b>'+esc(c.label)+'</b><small>'+fmt(c.v[0])+' kcal · P '+f1(c.v[1])+' · C '+f1(c.v[2])+' · F '+f1(c.v[3])+' · '+esc(c.src)+(c.serving>0?' · serving ~'+Math.round(c.serving)+' g':'')+'</small>'+(c.note?'<small>'+esc(c.note)+'</small>':'')+'</button>';});
  h+='<button class="cand" data-act="skip"><b>None of these</b></button>';
  if(aiErr)h+='<div class="warn">'+esc(aiErr)+'</div>';
  else if(!hasAI)h+='<div class="warn">Not the right dish? Add an Anthropic API key in settings and I’ll search the whole web for it.</div>';
  pushMsg("a",h);
}
function pickCand(i){
  if(!pending||!pending.cands[i]){pushMsg("a","That choice has expired. Type the food again.");return;}
  const c=pending.cands[i],it=pending.cur,meal=pending.meal;

  S.custom=(S.custom||[]).filter(x=>norm(x.al)!==norm(it.name));
  S.custom.push({n:nm,al:it.name,v:c.v.map(x=>Math.round(x*100)/100),d,src:c.src});
  rebuildCustom();
  let h="Saved <b>"+esc(nm)+"</b> ("+esc(c.src)+") for next time.";
  if(it.log){
    if(it.replaceId){Object.keys(S.days).forEach(k=>{const es=S.days[k].entries||[];const i=es.findIndex(e=>e.id===it.replaceId);if(i>=0)es.splice(i,1);});}
    const out={add:[]};

function handle(text){
  const raw=text.trim();
  if(!raw)return;
  const low=raw.toLowerCase();
  pushMsg("u",esc(raw));
  if(/^(help|\?|how)$/.test(low)){pushMsg("a",HELP);return;}
  if(/^(undo|undo last|delete last|remove last)$/.test(low)){
    const es=getEntries(cur);
    if(!es.length){pushMsg("a","Nothing to undo for "+esc(dayLabel(cur))+".");return;}
    let li=0;es.forEach((e,i)=>{if(e.ts>=es[li].ts)li=i;});
    const gone=es.splice(li,1)[0];save();render();
    pushMsg("a","Removed <b>"+esc(gone.name)+"</b> ("+esc(gone.qty)+").");return;
  }
  if(/^(summary|today|total|status)$/.test(low)){
    const t=totals(cur),g=goals();
    pushMsg("a","<b>"+esc(dayLabel(cur))+"</b><div class=\"tot\">"+fmt(t.kcal)+" kcal eaten, −"+fmt(t.burn)+" burned = <b>"+fmt(t.net)+" net</b> of "+fmt(g.kcal)+".<br>Protein "+f1(t.p)+" of "+g.p+" g · carbs "+f1(t.c)+" g · fat "+f1(t.f)+" g.</div>");return;
  }
  if(/^(saved|saved foods|my foods|list foods)$/.test(low)){
    const L=S.custom||[];
    pushMsg("a",L.length?"<b>Saved foods</b>"+L.map(c=>'<div class="row"><div>'+esc(c.n)+'<small>'+(c.ub?"per serving":"per 100 g")+'</small></div><div class="num">'+fmt(c.v[0])+' kcal</div></div>').join("")+'<div class="warn">Remove one with <code>forget '+esc(L[0].al)+'</code>.</div>':"Nothing saved yet. Try <code>save suran sabzi per 100 g 105 kcal 2p 16c 4f</code>.");
    return;
  }
  const fg=/^forget\s+(.+)$/i.exec(raw);
  if(fg){
    const before=(S.custom||[]).length;
    S.custom=(S.custom||[]).filter(c=>norm(c.al)!==norm(fg[1]));
    S.aliases=(S.aliases||[]).filter(a=>norm(a.al)!==norm(fg[1]));
    rebuildCustom();save();
    pushMsg("a",S.custom.length<before?"Forgot <b>"+esc(fg[1])+"</b>. Built-in values will be used again.":"I haven’t saved anything called <b>"+esc(fg[1])+"</b>. Say <code>saved</code> to see your list.");
    return;
  }
  const sv=/^(?:save|store|remember)\b\s*[:\-]?\s*(.*)$/i.exec(raw);
  if(sv){
    const rest=sv[1].trim();
    if(!rest){if(lastSpec)saveSpec(lastSpec);else pushMsg("a",SAVE_HELP);return;}
    const sp=parseSpec(rest);
    if(!sp.usable){pushMsg("a",SAVE_HELP);return;}
    if(!sp.name){pushMsg("a","What should I call it? For example <code>save suran sabzi per 100 g 105 kcal 2p 16c 4f</code>.");return;}
    saveSpec(sp);return;
  }
  const lk=/^(?:lookup|look up|search|check online|find online)\s+(.+)$/i.exec(raw);
  if(lk){
    if(navigator.onLine===false){pushMsg("a","You’re offline right now. Try again when internet is on.");return;}
    pending={queue:[{name:norm(lk[1]),qty:1,unit:null,mult:1,log:false}],meal:null,cur:null,cands:[]};
    nextLookup();return;
  }
  let body=raw,preMeal=null;
  const pm=/^\s*(breakfast|brunch|lunch|dinner|supper|snacks?|evening snack|tea time)\b\s*[:\-–]?\s*/i.exec(body);
  if(pm){preMeal=mealName(pm[1]);body=body.replace(pm[0],"");}
  const specs=[],normal=[];
  groupInput(body).forEach(c=>{
    const sp=parseSpec(c);
    if(specUsable(sp,c))specs.push(sp);else normal.push(c);
  });
  const out=normal.length?parseMessage(normal.join(", ")):{meal:null,add:[],unk:[],unkq:[],partial:[],ask:[],multi:[],fuzzy:[]};
  const meal=out.meal||preMeal||autoMeal();
  const specLogged=[];
  specs.forEach(sp=>{
    const r=specToEntry(sp);
    if(r.ask)out.ask.push(r.ask);
    else{out.add.push(r.entry);specLogged.push({sp,e:r.entry});}
  });
  commit(out.add,meal);
  let h=rowsHTML(out.add,meal);
  specLogged.forEach(x=>{
    lastSpec=x.sp;
    const k="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    specMap[k]=x.sp;
    h+='<button class="cand" data-act="savespec" data-k="'+k+'"><b>Save “'+esc(x.e.name)+'” for next time</b><small>'+(x.sp.per||x.sp.w.length?"Uses the weight you gave":"Counts as one serving")+'</small></button>';
  });
  out.ask.forEach(a=>{h+='<div class="warn">'+esc(a)+'</div>';});
  const offline=navigator.onLine===false;
  if(out.unk.length){
    if(offline)h+='<div class="warn">I don’t have <b>'+out.unk.map(esc).join(", ")+'</b> yet, and you’re offline. When internet is on, type <code>lookup '+esc(out.unk[0])+'</code>. Or '+manualHint(out.unk[0]).replace(/^Add/,"add")+'</div>';
  }
  if(!offline){
    out.partial.forEach(p=>{
      const e=out.add[p.addIndex];if(!e)return;
      p.replaceId=e.id;
      const k="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      partialMap[k]=p;
      h+='<div class="warn">I don’t know <b>'+esc(p.name)+'</b>, so I used the generic <b>'+esc(e.name)+'</b>.</div>';
      const sg=suggest(p.name,4).filter(c=>c.f.n!==e.name).slice(0,3);
      if(sg.length){const sh=sugHTML(Object.assign({log:true},p),sg,meal);h+='<div class="warn">Closest matches. Tap one to switch:</div>'+sh.h;}
      h+='<button class="cand" data-act="lookupq" data-k="'+k+'"><b>Look up exact values for '+esc(p.name)+'</b><small>Searches online, then replaces this entry and saves it</small></button>';
    });
  }
  if(out.fuzzy.length)h+='<div class="warn">I read '+out.fuzzy.map(esc).join("; ")+'. If that’s wrong, say <code>undo</code> and type it another way.</div>';
  if(out.multi.length)h+='<div class="warn">I read <b>'+out.multi.map(esc).join("; ")+'</b> as separate foods. If that’s wrong, say <code>undo</code> and type it as one item, or add it yourself like <code>name 150 kcal 8p 20c 3f</code>.</div>';
  if(!out.add.length&&!out.ask.length&&!out.unk.length)h="I couldn’t read that. Try <code>2 roti, 1 katori dal</code> or <code>30 min running</code>.";
  if(out.add.length)h+=totalHTML();
  pushMsg("a",h);
  render();
  if(out.unkq.length&&!offline){
    sq={queue:out.unkq.map(u=>Object.assign({log:true},u)),meal};
    sqNext();
  }
}

document.addEventListener("click",ev=>{

    if(!(S.custom||[]).length){b.textContent="Nothing saved";return;}
    if(!forgetArmed){forgetArmed=true;b.textContent="Tap again";return;}
    S.custom=[];S.aliases=[];rebuildCustom();save();forgetArmed=false;b.textContent="Forget";$("#savedN").firstChild.textContent="Saved foods: 0";return;
  }
  if(a==="send"){const inp=$("#inp");const v=inp.value;inp.value="";handle(v);return;}
  if(a==="clear"){
    if(!clearArmed){clearArmed=true;b.textContent="Tap again to delete everything";return;}
    S.days={};S.chat=[];S.custom=[];S.aliases=[];rebuildCustom();save();clearArmed=false;b.textContent="Clear all data";
    pushMsg("a",GREETING);render();$("#ov").classList.remove("on");return;
  }
});
$("#sKey").addEventListener("input",ev=>{S.settings.usdaKey=ev.target.value.trim();save();});
$("#sAI").addEventListener("input",ev=>{S.settings.aiKey=ev.target.value.trim();save();});
$("#inp").addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){ev.preventDefault();const v=ev.target.value;ev.target.value="";handle(v);}
});
[["#sWeight","weight",20,250],["#sKcal","kcal",800,6000],["#sPro","protein",10,400]].forEach(c=>{
  $(c[0]).addEventListener("input",ev=>{
    const v=parseFloat(ev.target.value);
    if(!isNaN(v)&&v>=c[2]&&v<=c[3]){S.settings[c[1]]=v;save();render();}
  });
});

if(!S.chat.length){S.chat.push({r:"a",h:GREETING});save();}
drawChat();
render();
})();
</script>
</body>
</html>
